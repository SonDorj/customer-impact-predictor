name: Verify predictor
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-api.lock.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements-api.lock.txt
      - name: Verify package and unit/API behavior
        run: |
          python scripts/verify_checkout.py
          python -m unittest discover -s tests -v
      - name: Build and test Spring Boot
        working-directory: springboot-service
        shell: bash
        run: ./mvnw -B -ntp -s maven-settings.xml package
      - name: Verify actual service integration
        env:
          RUN_STACK_INTEGRATION: "1"
        run: python -m unittest discover -s tests -p test_stack_integration.py -v
